name: easy-ponto

services:
  database:
    image: postgres:18-alpine
    env_file: ../../.env.development
    ports:
      - '5432:5432'
    volumes:
      - database:/var/lib/postgresql

  database-test:
    image: postgres:18-alpine
    env_file: ../../.env.test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql

volumes:
  database:
