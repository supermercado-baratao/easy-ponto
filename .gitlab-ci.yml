image: node:lts

stages:
  - install
  - lint
  - test

variables:
  PNPM_STORE_PATH: node_modules/.pnpm-store

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - $PNPM_STORE_PATH

default:
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest-10 --activate
    - pnpm config set store-dir $PNPM_STORE_PATH
    - pnpm config set enable-pre-post-scripts true

.pnpm-install: &pnpm_install
  needs:
    - install

install:
  stage: install
  script:
    - pnpm install --frozen-lockfile --ignore-scripts
  artifacts:
    paths:
      - node_modules/
    expire_in: 1h
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - $PNPM_STORE_PATH
    policy: pull-push

lint:commitlint:
  stage: lint
  <<: *pnpm_install
  variables:
    GIT_DEPTH: 0
  script:
    - pnpm exec commitlint --from ${CI_MERGE_REQUEST_DIFF_BASE_SHA} --to ${CI_COMMIT_SHA}

lint:prettier:
  stage: lint
  <<: *pnpm_install
  script:
    - pnpm prettier:check

lint:eslint:
  stage: lint
  <<: *pnpm_install
  script:
    - pnpm eslint:check

test:
  stage: test
  <<: *pnpm_install
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - !reference [default, before_script]
    - cp -n .env.example .env
    - sed -i -e 's/=localhost/=docker/g' -e 's/@localhost/@docker/g' .env
    - curl -fsSL https://get.docker.com -o get-docker.sh
    - sh ./get-docker.sh
    - pnpm exec playwright install --with-deps chromium
  script:
    - pnpm test
